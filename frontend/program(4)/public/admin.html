<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>器药同溯 · 文物管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; }
  header { background: linear-gradient(135deg,#2c3e50,#4a6741); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .sub { font-size: 13px; opacity: .8; margin-top: 4px; }
  .toolbar { padding: 18px 28px; display: flex; gap: 12px; align-items: center; }
  .toolbar input { flex: 1; max-width: 320px; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .toolbar button { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #4a6741; color: #fff; }
  .btn-primary:hover { background: #3c5336; }
  .wrap { padding: 0 28px 30px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  th, td { padding: 11px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { background: #f0f1f5; font-weight: 600; color: #555; }
  tr:hover td { background: #fafbfd; }
  .desc { color: #888; max-width: 320px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .op button { margin-right: 6px; padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .btn-edit { background: #e8f0fe; color: #1a73e8; }
  .btn-del { background: #fde8e8; color: #d93025; }
  .pager { margin-top: 16px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; font-size: 13px; }
  .pager button { padding: 6px 14px; border: 1px solid #ccc; background: #fff; border-radius: 5px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .empty { text-align: center; color: #aaa; padding: 40px; }
  /* 模态框 */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 10; }
  .mask.show { display: flex; }
  .modal { background: #fff; width: 560px; max-width: 94vw; max-height: 90vh; overflow: auto; border-radius: 10px; padding: 22px 26px; }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  .form-grid input, .form-grid textarea, .form-grid select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .modal .btns { margin-top: 18px; display: flex; gap: 10px; justify-content: flex-end; }
  .modal .btns button { padding: 9px 22px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-cancel { background: #eee; color: #333; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .3s; }
  .toast.ok { background: #4a6741; }
  .toast.err { background: #d93025; }
</style>
</head>
<body>
<header>
  <div>
    <h1>器药同溯 · 文物知识管理后台</h1>
    <div class="sub">MySQL 数据库管理 · 增删改查</div>
  </div>
</header>

<div class="toolbar">
  <input id="kw" placeholder="搜索名称 / 类别 / 年代…" onkeydown="if(event.key==='Enter')load(1)">
  <button class="btn-primary" onclick="load(1)">搜索</button>
  <button class="btn-primary" onclick="openEdit()">+ 新增文物</button>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>图片文件</th><th>名称</th><th>年代</th><th>类别</th><th>材质</th><th>描述</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">暂无数据</div>
  <div class="pager">
    <span id="pageInfo"></span>
    <button id="prevBtn" onclick="load(page-1)">上一页</button>
    <button id="nextBtn" onclick="load(page+1)">下一页</button>
  </div>
</div>

<!-- 新增/编辑模态框 -->
<div class="mask" id="mask">
  <div class="modal">
    <h2 id="modalTitle">新增文物</h2>
    <div class="form-grid">
      <div class="full"><label>图片文件名 image_id *</label><input id="f_image_id"></div>
      <div><label>名称 name *</label><input id="f_name"></div>
      <div><label>年代 dynasty</label><input id="f_dynasty"></div>
      <div><label>类别 type</label><input id="f_type"></div>
      <div><label>材质 material</label><input id="f_material"></div>
      <div class="full"><label>用途 usage</label><input id="f_usage"></div>
      <div><label>相关穴位 acupoint</label><input id="f_acupoint"></div>
      <div><label>相关人物 celebrity</label><input id="f_celebrity"></div>
      <div><label>功效 benefit</label><input id="f_benefit"></div>
      <div><label>价值 value</label><input id="f_value"></div>
      <div class="full"><label>描述 description</label><textarea id="f_description" rows="3"></textarea></div>
    </div>
    <div class="btns">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-primary" onclick="save()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let page = 1;
let pageSize = 20;
let editingId = null;

const FIELDS = ['image_id','name','dynasty','type','material','description',
  'usage','acupoint','celebrity','benefit','value'];

async function load(p) {
  page = p || 1;
  const kw = document.getElementById('kw').value.trim();
  const url = `/admin/api/artifacts?page=${page}&page_size=${pageSize}&keyword=${encodeURIComponent(kw)}`;
  try {
    const res = await fetch(url);
    const json = await res.json();
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    const empty = document.getElementById('empty');
    empty.style.display = json.data.length ? 'none' : 'block';
    json.data.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.id}</td><td>${esc(r.image_id)}</td><td><b>${esc(r.name||'')}</b></td>` +
        `<td>${esc(r.dynasty||'')}</td><td>${esc(r.type||'')}</td><td>${esc(r.material||'')}</td>` +
        `<td class="desc">${esc(r.description||'')}</td>` +
        `<td class="op"><button class="btn-edit" onclick="openEdit(${r.id})">编辑</button>` +
        `<button class="btn-del" onclick="del(${r.id})">删除</button></td>`;
      tb.appendChild(tr);
    });
    document.getElementById('pageInfo').textContent = `共 ${json.total} 条 · 第 ${json.page} 页`;
    document.getElementById('prevBtn').disabled = json.page <= 1;
    document.getElementById('nextBtn').disabled = json.page * json.page_size >= json.total;
  } catch(e) { toast('加载失败：' + e.message, 'err'); }
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function openEdit(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? '编辑文物' : '新增文物';
  document.getElementById('mask').classList.add('show');
  FIELDS.forEach(f => document.getElementById('f_' + f).value = '');
  if (!id) return;
  // 编辑：从列表接口取当前页数据找对应记录
  try {
    const res = await fetch(`/admin/api/artifacts?page=1&page_size=1000&keyword=`);
    const json = await res.json();
    const row = json.data.find(r => r.id === id);
    if (row) FIELDS.forEach(f => document.getElementById('f_' + f).value = row[f] || '');
  } catch(e) {}
}

function closeEdit(){ document.getElementById('mask').classList.remove('show'); editingId = null; }

async function save() {
  const data = {};
  FIELDS.forEach(f => data[f] = document.getElementById('f_' + f).value.trim());
  if (!data.image_id) { toast('image_id 不能为空', 'err'); return; }
  const url = editingId ? `/admin/api/artifacts/${editingId}` : '/admin/api/artifacts';
  const method = editingId ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
    const json = await res.json();
    if (json.success) { toast(editingId ? '更新成功' : '新增成功', 'ok'); closeEdit(); load(1); }
    else toast('保存失败：' + (json.message||''), 'err');
  } catch(e) { toast('保存失败：' + e.message, 'err'); }
}

async function del(id) {
  if (!confirm('确定删除这条文物记录吗？')) return;
  try {
    const res = await fetch(`/admin/api/artifacts/${id}`, { method: 'DELETE' });
    const json = await res.json();
    if (json.success) { toast('已删除', 'ok'); load(page); }
    else toast('删除失败：' + (json.message||''), 'err');
  } catch(e) { toast('删除失败：' + e.message, 'err'); }
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'ok'); t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2200);
}

document.getElementById('mask').addEventListener('click', e => { if (e.target.id === 'mask') closeEdit(); });
load(1);
</script>
</body>
</html>
